name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22 for the built-in SQLite module used by the main process.
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx electron-vite build

      - name: Smoke test the built app
        # Electron needs a display server and cannot use its sandbox in CI.
        run: xvfb-run -a npx electron --no-sandbox scripts/smoke.cjs
