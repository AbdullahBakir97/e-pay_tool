[project]
name = "epay-tool"
version = "0.1.0"
description = "Desktop app that automates creating eBay.de listings from barcodes and photos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "keyring>=25.0",
    "google-genai>=1.0",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
epay-tool = "epay_tool.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epay_tool"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# The user-facing strings are German and use proper typography (en dash,
# umlauts), which RUF001-003 flag as "ambiguous unicode".
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
